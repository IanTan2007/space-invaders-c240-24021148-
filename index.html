<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders - Mission A</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600" aria-label="Space Invaders game canvas"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const context = canvas.getContext("2d");
    const shipStartX = 380;
    const shipStartY = 560;
    const ship = { x: shipStartX, y: shipStartY, width: 40, height: 20, speed: 300 };
    const alienPixelSize = 5;
    const alienCount = 10;
    const alienColumnGap = 30;
    const alienWidth = alienPixelSize * 8;
    const alienFormationWidth = alienCount * alienWidth + (alienCount - 1) * alienColumnGap;
    const alienStartX = (canvas.width - alienFormationWidth) / 2;
    const alienStepSize = 10;
    const alienStepInterval = 0.25;
    const alienDescentStep = 20;
    const alienHeight = 8 * alienPixelSize;
    const bunkerCellSize = 8;
    const bunkerPattern = [
      "00111100",
      "01111110",
      "11111111",
      "11011011",
      "11000011"
    ];
    const bunkerWidth = bunkerPattern[0].length * bunkerCellSize;
    const bunkerCount = 4;
    const bunkerStartY = 430;
    const playerShotCooldown = 400;
    const alienRows = [
      {
        y: 70,
        color: "#ff5c5c",
        design: [
          "00100100",
          "00011000",
          "00111100",
          "01111110",
          "11011011",
          "11111111",
          "10100101",
          "00100100"
        ]
      },
      {
        y: 125,
        color: "#ffd84d",
        design: [
          "00011000",
          "00111100",
          "01111110",
          "11011011",
          "11111111",
          "00100100",
          "01011010",
          "10000001"
        ]
      },
      {
        y: 180,
        color: "#54e68a",
        design: [
          "00111100",
          "01111110",
          "11111111",
          "11011011",
          "11111111",
          "00100100",
          "01011010",
          "10100101"
        ]
      }
    ];
    const alienFormation = { x: 0, y: 0, direction: 1 };
    const livingAliens = alienRows.map(() => Array(alienCount).fill(true));
    const playerBullets = [];
    const alienBullets = [];
    let bunkers = createBunkers();
    const keys = new Set();
    let lives = 3;
    let gameOver = false;
    let gameComplete = false;
    let previousTime = 0;
    let alienStepElapsed = 0;
    let alienFireElapsed = 1;
    let lastPlayerShotTime = -playerShotCooldown;

    function createBunkers() {
      const gap = (canvas.width - bunkerCount * bunkerWidth) / (bunkerCount + 1);
      return Array.from({ length: bunkerCount }, (_, index) => ({
        x: gap + index * (bunkerWidth + gap),
        y: bunkerStartY,
        sections: bunkerPattern.map((row) => Array.from(row, (pixel) => pixel === "1"))
      }));
    }

    function drawBunkers() {
      context.fillStyle = "#35d04f";
      bunkers.forEach((bunker) => {
        bunker.sections.forEach((row, rowIndex) => {
          row.forEach((isIntact, columnIndex) => {
            if (isIntact) {
              context.fillRect(
                bunker.x + columnIndex * bunkerCellSize,
                bunker.y + rowIndex * bunkerCellSize,
                bunkerCellSize,
                bunkerCellSize
              );
            }
          });
        });
      });
    }

    function drawAliens() {
      alienRows.forEach((row, rowIndex) => {
        context.fillStyle = row.color;
        for (let column = 0; column < alienCount; column += 1) {
          if (!livingAliens[rowIndex][column]) {
            continue;
          }
          row.design.forEach((pixelRow, y) => {
            for (let x = 0; x < pixelRow.length; x += 1) {
              if (pixelRow[x] === "1") {
                context.fillRect(
                  alienStartX + alienFormation.x + column * (alienWidth + alienColumnGap) + x * alienPixelSize,
                  row.y + alienFormation.y + y * alienPixelSize,
                  alienPixelSize,
                  alienPixelSize
                );
              }
            }
          });
        }
      });
    }

    function draw() {
      context.fillStyle = "#000";
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawAliens();
      drawBunkers();
      context.fillStyle = "#fff";
      playerBullets.forEach((bullet) => context.fillRect(bullet.x, bullet.y, bullet.width, bullet.height));
      context.fillStyle = "#ff5c5c";
      alienBullets.forEach((bullet) => context.fillRect(bullet.x, bullet.y, bullet.width, bullet.height));
      context.fillStyle = "#fff";
      context.fillRect(ship.x, ship.y, ship.width, ship.height);
      context.font = "20px sans-serif";
      context.textAlign = "left";
      context.fillText(`Lives: ${lives}`, 16, 28);
      if (gameOver) {
        context.fillStyle = "#fff";
        context.font = "48px sans-serif";
        context.textAlign = "center";
        context.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
        context.font = "20px sans-serif";
        context.fillText("Press R to restart", canvas.width / 2, canvas.height / 2 + 36);
      } else if (gameComplete) {
        context.fillStyle = "#fff";
        context.font = "48px sans-serif";
        context.textAlign = "center";
        context.fillText("GAME COMPLETE!", canvas.width / 2, canvas.height / 2);
        context.font = "20px sans-serif";
        context.fillText("Press R to restart", canvas.width / 2, canvas.height / 2 + 36);
      }
      context.fillStyle = "#fff";
      context.font = "12px sans-serif";
      context.textAlign = "right";
      context.fillText("Name: E65Q - IAN TAN", canvas.width - 12, canvas.height - 6);
    }

    function overlaps(first, second) {
      return first.x < second.x + second.width &&
        first.x + first.width > second.x &&
        first.y < second.y + second.height &&
        first.y + first.height > second.y;
    }

    function damageBunkerAtImpact(bullet, direction) {
      const previousY = bullet.previousY;
      const sweptBullet = {
        x: bullet.x,
        y: Math.min(previousY, bullet.y),
        width: bullet.width,
        height: Math.abs(bullet.y - previousY) + bullet.height
      };
      let impactedSection = null;
      let nearestImpact = Infinity;

      bunkers.forEach((bunker) => {
        bunker.sections.forEach((row, rowIndex) => {
          row.forEach((isIntact, columnIndex) => {
            if (!isIntact) {
              return;
            }

            const section = {
              x: bunker.x + columnIndex * bunkerCellSize,
              y: bunker.y + rowIndex * bunkerCellSize,
              width: bunkerCellSize,
              height: bunkerCellSize
            };
            if (!overlaps(sweptBullet, section)) {
              return;
            }

            let impactDistance;
            if (direction < 0) {
              if (previousY >= section.y + section.height) {
                impactDistance = previousY - (section.y + section.height);
              } else if (previousY + bullet.height > section.y) {
                impactDistance = 0;
              } else {
                return;
              }
            } else if (previousY + bullet.height <= section.y) {
              impactDistance = section.y - bullet.height - previousY;
            } else if (previousY < section.y + section.height) {
              impactDistance = 0;
            } else {
              return;
            }
            if (impactDistance >= 0 && impactDistance < nearestImpact) {
              nearestImpact = impactDistance;
              impactedSection = { bunker, rowIndex, columnIndex };
            }
          });
        });
      });

      if (!impactedSection) {
        return false;
      }

      impactedSection.bunker.sections[impactedSection.rowIndex][impactedSection.columnIndex] = false;
      return true;
    }

    function fireAlienBullet() {
      const candidates = [];
      livingAliens.forEach((row, rowIndex) => {
        row.forEach((isAlive, column) => {
          if (isAlive) {
            candidates.push({ rowIndex, column });
          }
        });
      });
      if (candidates.length === 0) {
        return;
      }

      const shooter = candidates[Math.floor(Math.random() * candidates.length)];
      const row = alienRows[shooter.rowIndex];
      alienBullets.push({
        x: alienStartX + alienFormation.x + shooter.column * (alienWidth + alienColumnGap) + alienWidth / 2 - 2,
        y: row.y + alienFormation.y + alienHeight,
        width: 4,
        height: 12,
        speed: 240
      });
    }

    function update(time) {
      if (gameOver || gameComplete) {
        draw();
        requestAnimationFrame(update);
        return;
      }

      const elapsed = Math.min((time - previousTime) / 1000, 0.05);
      previousTime = time;

      if (keys.has("ArrowLeft")) {
        ship.x -= ship.speed * elapsed;
      }
      if (keys.has("ArrowRight")) {
        ship.x += ship.speed * elapsed;
      }
      ship.x = Math.max(0, Math.min(canvas.width - ship.width, ship.x));

      playerBullets.forEach((bullet) => {
        bullet.previousY = bullet.y;
        bullet.y -= bullet.speed * elapsed;
      });
      alienBullets.forEach((bullet) => {
        bullet.previousY = bullet.y;
        bullet.y += bullet.speed * elapsed;
      });

      alienStepElapsed += elapsed;
      while (alienStepElapsed >= alienStepInterval) {
        alienStepElapsed -= alienStepInterval;
        const nextX = alienFormation.x + alienFormation.direction * alienStepSize;
        const leftEdge = alienStartX + nextX;
        const rightEdge = leftEdge + alienFormationWidth;

        if (alienFormation.direction > 0 && rightEdge >= canvas.width) {
          alienFormation.x = canvas.width - alienStartX - alienFormationWidth;
          alienFormation.y += alienDescentStep;
          alienFormation.direction = -1;
        } else if (alienFormation.direction < 0 && leftEdge <= 0) {
          alienFormation.x = -alienStartX;
          alienFormation.y += alienDescentStep;
          alienFormation.direction = 1;
        } else {
          alienFormation.x = nextX;
        }
      }

      const alienReachedPlayer = alienRows.some((row, rowIndex) =>
        livingAliens[rowIndex].some(Boolean) &&
        row.y + alienFormation.y + alienHeight >= ship.y
      );
      if (alienReachedPlayer) {
        gameOver = true;
        draw();
        requestAnimationFrame(update);
        return;
      }

      for (let bulletIndex = playerBullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
        if (damageBunkerAtImpact(playerBullets[bulletIndex], -1)) {
          playerBullets.splice(bulletIndex, 1);
        }
      }

      for (let bulletIndex = playerBullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
        const bullet = playerBullets[bulletIndex];
        let hit = false;
        for (let rowIndex = 0; rowIndex < alienRows.length; rowIndex += 1) {
          const row = alienRows[rowIndex];
          for (let column = 0; column < alienCount; column += 1) {
            if (!livingAliens[rowIndex][column]) {
              continue;
            }

            const alien = {
              x: alienStartX + alienFormation.x + column * (alienWidth + alienColumnGap),
              y: row.y + alienFormation.y,
              width: alienWidth,
              height: alienHeight
            };
            if (overlaps(bullet, alien)) {
              livingAliens[rowIndex][column] = false;
              hit = true;
              break;
            }
          }
          if (hit) {
            break;
          }
        }
        if (hit) {
          playerBullets.splice(bulletIndex, 1);
        }
      }

      if (livingAliens.every((row) => row.every((isAlive) => !isAlive))) {
        gameComplete = true;
        draw();
        requestAnimationFrame(update);
        return;
      }

      for (let index = playerBullets.length - 1; index >= 0; index -= 1) {
        if (playerBullets[index].y + playerBullets[index].height < 0) {
          playerBullets.splice(index, 1);
        }
      }
      for (let index = alienBullets.length - 1; index >= 0; index -= 1) {
        const bullet = alienBullets[index];
        if (damageBunkerAtImpact(bullet, 1)) {
          alienBullets.splice(index, 1);
        } else if (overlaps(bullet, ship)) {
          lives = Math.max(0, lives - 1);
          alienBullets.splice(index, 1);
          if (lives === 0) {
            gameOver = true;
          }
        } else if (bullet.y > canvas.height) {
          alienBullets.splice(index, 1);
        }
      }

      if (gameOver || gameComplete) {
        draw();
        requestAnimationFrame(update);
        return;
      }

      alienFireElapsed -= elapsed;
      if (alienFireElapsed <= 0) {
        fireAlienBullet();
        alienFireElapsed = 1 + Math.random() * 1.5;
      }

      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener("keydown", (event) => {
      if (gameOver || gameComplete) {
        if (event.key.toLowerCase() === "r") {
          lives = 3;
          ship.x = shipStartX;
          ship.y = shipStartY;
          alienFormation.x = 0;
          alienFormation.y = 0;
          alienFormation.direction = 1;
          livingAliens.forEach((row) => row.fill(true));
          playerBullets.length = 0;
          alienBullets.length = 0;
          bunkers = createBunkers();
          lastPlayerShotTime = -playerShotCooldown;
          alienStepElapsed = 0;
          alienFireElapsed = 1;
          previousTime = performance.now();
          keys.clear();
          gameOver = false;
          gameComplete = false;
          draw();
        }
        return;
      }

      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        keys.add(event.key);
      }
      if (event.code === "Space") {
        event.preventDefault();
        const now = performance.now();
        if (!event.repeat &&
            playerBullets.length === 0 &&
            now - lastPlayerShotTime >= playerShotCooldown) {
          playerBullets.push({
            x: ship.x + ship.width / 2 - 2,
            y: ship.y,
            width: 4,
            height: 10,
            speed: 450
          });
          lastPlayerShotTime = now;
        }
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key);
    });

    window.addEventListener("blur", () => keys.clear());

    draw();
    requestAnimationFrame(update);
  </script>
</body>
</html>
